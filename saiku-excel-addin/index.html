<html>
  <head>

        background: #ffffff;
        color: #201f1e;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      #app { background: #ffffff; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
