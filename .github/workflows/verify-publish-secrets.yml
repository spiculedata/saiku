# Manual check that the npm publishing credential stored in the `npm-publish`
# environment is valid, without publishing anything (#2333 / #2335 follow-up).
#
# Runs only on workflow_dispatch, in the `npm-publish` environment, so it pauses
# for a maintainer's approval like a real publish. It prints the npm account the
# token belongs to and the @concepttocloud packages it can reach; it never
# prints the token. The `release` environment only admits `v*` tags, so its
# copy of NPM_TOKEN is exercised by the next approved release instead.
name: verify-publish-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-publish:
    name: NPM_TOKEN in npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-publish
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm whoami and scope access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty in the npm-publish environment"
            exit 1
          fi
          user=$(npm whoami)
          echo "Token authenticates as: $user"
          echo "### npm-publish NPM_TOKEN" >>"$GITHUB_STEP_SUMMARY"
          echo "Authenticates as \`$user\`." >>"$GITHUB_STEP_SUMMARY"
          npm access list packages @concepttocloud --json \
            | jq -r 'to_entries[] | "\(.key): \(.value)"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
