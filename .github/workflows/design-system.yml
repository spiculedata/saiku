name: design-system

# Publishes @concepttocloud/saiku-design-system — the design tokens, Tailwind
# v4 theme bridge and Svelte primitives shared by saiku-ui (this repo) and the
# Saiku Cloud dashboard (private repo, consumes this from npm).
#
# This is DELIBERATELY not part of release.yml. The design system moves on its
# own cadence: coupling it to product releases would mean saiku-cloud waits for
# a full Saiku release every time a token changes. One publish path, triggered
# by changes to the package itself.
#
# Publishing is idempotent — the job checks the registry first and skips
# cleanly when the version is already out there, so a merge that touches the
# package without bumping its version is a no-op rather than a failure. To cut
# a new version: bump `version` in saiku-ui/design-system/package.json and
# merge; the push trigger does the rest.
on:
  push:
    branches: [development, main]
    paths:
      - "saiku-ui/design-system/**"
      - ".github/workflows/design-system.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but don't publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # saiku#2335: the build runs the untrusted npm lifecycle (saiku-ui's whole transitive tree), so
  # it holds no id-token and no npm token. The publish job below only handles the packed tarball.
  build:
    name: Build + verify (unprivileged)
    runs-on: ubuntu-latest
    permissions:
      contents: read # NO id-token and no registry credential in this job
    outputs:
      version: ${{ steps.verify.outputs.version }}
      exists: ${{ steps.registry.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: saiku-ui/package-lock.json

      - name: Install + build
        working-directory: saiku-ui
        # --ignore-scripts: no third-party install/postinstall/prepare runs. The
        # design-system is built explicitly below (svelte-package needs no
        # lifecycle script). If a dependency ever needs a native rebuild, list
        # it here by name with `npm rebuild <pkg>` so the list stays reviewable.
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build --workspace @concepttocloud/saiku-design-system

      - name: Type-check the package
        working-directory: saiku-ui/design-system
        run: npm run check

      - name: Verify the built package is complete
        # svelte-package can fail "successfully" (a bad --input path, say) and
        # leave a dist/ with no entry points. Publishing that breaks every
        # consumer with a resolution error rather than a build failure, so
        # assert every export target exists before we go near the registry.
        id: verify
        run: |
          set -euo pipefail
          DS=saiku-ui/design-system
          for f in dist/index.js dist/index.d.ts dist/ui/index.js dist/ui/index.d.ts \
                   dist/styles/tokens.css dist/styles/tailwind.css; do
            if [ ! -s "$DS/$f" ]; then
              echo "::error::design-system build is missing $f"
              exit 1
            fi
          done
          VERSION=$(node -p "require('./$DS/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built @concepttocloud/saiku-design-system@$VERSION"

      - name: Check whether this version is already published
        # Explicit check rather than swallowing npm's 409 on publish: a
        # swallowed error hides a genuine failure (bad token, registry outage)
        # behind the same warning as the benign already-published case.
        id: registry
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@concepttocloud/saiku-design-system@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@concepttocloud/saiku-design-system@$VERSION is already published — nothing to do. Bump the version in saiku-ui/design-system/package.json to cut a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@concepttocloud/saiku-design-system@$VERSION is not on the registry — will publish."
          fi

      - name: Pack the publishable tarball
        # Scripts off: the artefact is exactly the verified dist/, so the privileged
        # job never needs to run prepare/prepack.
        working-directory: saiku-ui/design-system
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"

      - name: Upload tarball
        if: steps.registry.outputs.exists == 'false' && !inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-system-tgz
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          ALREADY_PUBLISHED: ${{ steps.registry.outputs.exists }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            echo "⏭  @concepttocloud/saiku-design-system@$VERSION already published — skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "🧪 Dry run — @concepttocloud/saiku-design-system@$VERSION built and verified, not published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📦 @concepttocloud/saiku-design-system@$VERSION built and packed — the publish job follows." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish to npm (artefact only)
    needs: [build]
    if: needs.build.outputs.exists == 'false' && !inputs.dry_run
    runs-on: ubuntu-latest
    # Create the `npm-publish` environment with required reviewers (repository settings) and
    # move NPM_TOKEN into it, or enable npm Trusted Publishing and delete NPM_TOKEN.
    environment: npm-publish
    permissions:
      contents: read # no checkout at all
      id-token: write # OIDC token for npm provenance; only this job can mint one
    steps:
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: design-system-tgz
          path: pkg

      - name: Publish
        # NPM_TOKEN is an Automation token on the npm org, already used by the
        # embed packages in release.yml. `--provenance` needs `id-token: write`
        # (granted on this job) and attaches a signed SLSA statement. The
        # tarball path plus --ignore-scripts means no lifecycle script can run
        # with the token in the environment.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish pkg/*.tgz --access public --provenance --ignore-scripts
          echo "Published @concepttocloud/saiku-design-system@${{ needs.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
