name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version for a manual release (e.g. v3.17.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  jar:
    name: Build fat JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      jar_name: ${{ steps.meta.outputs.jar_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # See ci.yml for the rationale — multi-server settings.xml so the build
      # can resolve mondrian and the spiculedata olap4j / olap4j-xmlaserver
      # artifacts from GitHub Packages.
      - name: Configure Maven settings.xml
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server><id>github-mondrian-saiku</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-olap4j</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-olap4j-xmlaserver</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
            </servers>
          </settings>
          EOF

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF_TAG="${{ github.event.inputs.tag }}"
          else
            REF_TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${REF_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_name=saiku-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: mvn package (launcher)
        run: mvn -B -ntp -DskipTests -pl saiku-launcher -am package

      - name: Rename fat JAR
        run: |
          mkdir -p dist
          cp saiku-launcher/target/saiku-*.jar "dist/${{ steps.meta.outputs.jar_name }}"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: saiku-jar
          path: dist/${{ steps.meta.outputs.jar_name }}
          retention-days: 7

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: jar
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ needs.jar.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.jar.outputs.version }}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [jar, docker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: saiku-jar
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ needs.jar.outputs.jar_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
