name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version for a manual release (e.g. v3.17.0)"
        required: true

# Least-privilege default: read-only for the whole workflow. Each job below
# elevates ONLY the scope it needs (see per-job `permissions:` blocks), so a
# retagged third-party action can never run with more than its job requires.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  jar:
    name: Build fat JAR + dist zip
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
      packages: write # `mvn deploy` publishes module jars to GH Packages
    outputs:
      # ref_tag is the tag as pushed (v-prefixed); version has the v
      # stripped for filenames and headings. Anything addressing GitHub
      # — the releases API, a release URL — needs ref_tag, not version.
      ref_tag: ${{ steps.meta.outputs.ref_tag }}
      version: ${{ steps.meta.outputs.version }}
      jar_name: ${{ steps.meta.outputs.jar_name }}
      dist_name: ${{ steps.meta.outputs.dist_name }}
      sbom_name: ${{ steps.meta.outputs.sbom_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 22
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      # See ci.yml for the rationale — multi-server settings.xml so the build
      # can resolve mondrian and the spiculedata olap4j / olap4j-xmlaserver
      # artifacts from GitHub Packages.
      - name: Configure Maven settings.xml
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          # GH_PACKAGES_TOKEN is a PAT used for resolving inbound deps
          # (mondrian-saiku etc). For deploying THIS repo's own artifacts we
          # use the workflow's ephemeral GITHUB_TOKEN under server id
          # github-saiku-self — 'packages: write' is granted on THIS job (see
          # the jar job's per-job `permissions:` block), not workflow-wide.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server><id>github-mondrian-saiku</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-olap4j</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-olap4j-xmlaserver</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-saiku-query</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-saiku-self</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server>
            </servers>
          </settings>
          EOF

      - name: Resolve version
        id: meta
        # INPUT_TAG is user-controlled (workflow_dispatch input) — pass it
        # through env and reference "$INPUT_TAG", never interpolate
        # ${{ github.event.inputs.tag }} straight into the shell, or a crafted
        # tag string could inject commands into this step (CWE-1357/CWE-78).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REF_TAG="$INPUT_TAG"
          else
            REF_TAG="${GITHUB_REF_NAME}"
          fi
          # Strict-validate before anything is written to $GITHUB_OUTPUT: a
          # newline-bearing dispatch input could otherwise append extra
          # step outputs. Only vMAJOR.MINOR.PATCH (with optional -/. suffix).
          if [[ ! "$REF_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "::error::invalid tag: $REF_TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          VERSION="${REF_TAG#v}"
          echo "ref_tag=$REF_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_name=saiku-${VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "dist_name=saiku-dist-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "sbom_name=saiku-sbom-${VERSION}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: "mvn verify (fail-fast: spotless + tests)"
        # Defence in depth — branch protection SHOULD have caught any
        # spotless / test failure on the PR before the merge that led
        # to this tag, but the v4.5.1 release found that a red CI run
        # on a PR could still be merged (branch protection was off).
        # Run the full verify gate here so a busted tag fails BEFORE
        # we spend Docker / GH-Packages cycles + post a broken release.
        # `-DskipTests=false` is explicit so a stray `-DskipTests` in
        # the environment can't downgrade the gate; the upstream ci.yml
        # already established that the suite runs fast enough.
        run: mvn -B -ntp -DskipTests=false verify

      - name: mvn package (launcher)
        # saiku-launcher hosts both the REST + UI on :8080 AND the native
        # MCP endpoint at /rest/saiku/api/mcp (issue #878). The standalone
        # saiku-mcp stdio binary is gone — MCP hosts now hit the launcher
        # directly with per-user Basic auth.
        run: mvn -B -ntp -DskipTests -pl saiku-launcher -am package

      - name: mvn deploy (module jars to GH Packages)
        # Publishes saiku-bom + saiku-core/* to maven.pkg.github.com/spiculedata/saiku
        # so downstream consumers (saiku-cloud's IRepositoryManager
        # adapter, embedders) can `<dependency>` saiku-service the
        # normal way. saiku-launcher (fat jar) and saiku-webapp (raw
        # war) opt out via maven-deploy-plugin <skip>true</skip> in
        # their own poms — they ride to the GitHub Releases page only.
        #
        # `mvn deploy` from the reactor root walks every module in
        # <modules>; the two opt-outs above keep GH Packages free of
        # multi-hundred-meg blobs. Tests already ran in ci.yml on PR
        # merge — re-running them here would be wasted runner minutes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -DskipTests deploy

      - name: Stage release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # 1) Bare launcher fat JAR (versioned filename) — keeps the
          #    "give me just the JAR" path for users who don't want the
          #    bundle.
          cp "saiku-launcher/target/saiku-${VERSION}.jar" \
             "release-assets/saiku-${VERSION}.jar"
          # 2) Runnable dist bundle: launcher JAR + README + run scripts,
          #    zipped.
          STAGE="saiku-dist-${VERSION}"
          mkdir -p "$STAGE"
          cp "saiku-launcher/target/saiku-${VERSION}.jar" "$STAGE/"
          cp dist/README.md "$STAGE/"
          cp dist/run.sh "$STAGE/"
          cp dist/run.bat "$STAGE/"
          chmod +x "$STAGE/run.sh"
          # zip preserves +x so end users on Unix can ./run.sh post-extract.
          zip -r "release-assets/${STAGE}.zip" "$STAGE"
          # 3) CycloneDX SBOM (saiku#1990). cyclonedx-maven-plugin's
          #    makeAggregateBom writes ONE aggregate at the reactor top-level.
          #    The last Maven step in this job is a full-reactor `mvn deploy`,
          #    so the deterministic location is the root module's target/. Fall
          #    back to a tree search in case a future reordering moves it.
          SBOM_SRC="target/saiku-sbom.json"
          [ -f "$SBOM_SRC" ] || SBOM_SRC="$(find . -name saiku-sbom.json | head -1)"
          if [ -z "${SBOM_SRC:-}" ] || [ ! -f "$SBOM_SRC" ]; then
            echo "::error::no CycloneDX SBOM (saiku-sbom.json) was produced by the build"
            exit 1
          fi
          cp "$SBOM_SRC" "release-assets/saiku-sbom-${VERSION}.cdx.json"
          ls -la release-assets/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saiku-jar
          path: release-assets/${{ steps.meta.outputs.jar_name }}
          retention-days: 7

      - name: Upload dist zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saiku-dist
          path: release-assets/${{ steps.meta.outputs.dist_name }}
          retention-days: 7

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saiku-sbom
          path: release-assets/${{ steps.meta.outputs.sbom_name }}
          retention-days: 7

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: jar
    permissions:
      contents: read # checkout only
      packages: write # push the image AND its attestations to GHCR
      id-token: write # keyless Sigstore signing for build provenance (saiku#1992)
      attestations: write # record the SLSA provenance attestation on the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile no longer rebuilds saiku from sources (it can't
      # auth against the spiculedata GH Packages registries from inside
      # the Maven container). Instead it COPYs the pre-built launcher JAR
      # that the jar job produced.
      - name: Download saiku-jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saiku-jar
          path: build-context
      - name: Stage JAR for Docker build context
        env:
          JAR_NAME: ${{ needs.jar.outputs.jar_name }}
        run: |
          set -euo pipefail
          # The Dockerfile expects build-context/saiku.jar regardless of
          # the versioned filename — rename for a stable COPY target.
          mv "build-context/${JAR_NAME}" build-context/saiku.jar
          ls -la build-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ needs.jar.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.jar.outputs.version }}
            type=raw,value=latest

      - name: Build & push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # saiku#1990 + #1992: BuildKit attaches an SBOM + max-detail SLSA
          # provenance attestation manifest to the pushed image index. This
          # answers "what's in the image?" and "how was it built?" at the OCI
          # layer. The verifiable, Rekor-logged provenance is added separately
          # below via actions/attest-build-provenance.
          sbom: true
          provenance: mode=max

      - name: Attest image build provenance
        # saiku#1992: keyless Sigstore provenance for the image, logged to Rekor
        # and pushed to GHCR as a referring attestation, so consumers can run
        #   gh attestation verify oci://ghcr.io/spiculedata/saiku:<v> --repo spiculedata/saiku
        #   cosign verify-attestation --type slsaprovenance ...
        # against the exact digest we published. subject-digest is the
        # multi-arch index digest emitted by the build step above.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [jar, docker]
    permissions:
      contents: write # create the GitHub release + upload assets
      id-token: write # keyless Sigstore signing for JAR + dist provenance (saiku#1992)
      attestations: write # record the SLSA provenance attestations on the repo
    steps:
      # Pull the three artifacts the jar job uploaded — the bare versioned JAR,
      # the runnable saiku-dist zip, and the CycloneDX SBOM. All get attached
      # to the release.
      - name: Download saiku-jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saiku-jar
          path: release-assets
      - name: Download saiku-dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saiku-dist
          path: release-assets
      - name: Download saiku-sbom
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saiku-sbom
          path: release-assets
      - name: Confirm release assets staged
        run: ls -la release-assets/

      - name: Attest JAR + dist + SBOM build provenance
        # saiku#1992: keyless Sigstore provenance for the file assets, logged to
        # Rekor and recorded against this repo, so a consumer can run
        #   gh attestation verify saiku-<v>.jar --repo spiculedata/saiku
        # and prove the bytes came out of THIS workflow. Attestation is by
        # content digest, so attesting the same bytes the release publishes
        # (downloaded from the jar job) is equivalent to attesting at build time.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/${{ needs.jar.outputs.jar_name }}
            release-assets/${{ needs.jar.outputs.dist_name }}
            release-assets/${{ needs.jar.outputs.sbom_name }}

      - name: Generate SHA256SUMS
        # saiku#1992 / saiku#1919 (18b): a plain checksums manifest over every
        # published asset. Useful on its own (offline integrity check) and as
        # the low-tech complement to the Sigstore attestations above. Computed
        # with basenames so `sha256sum -c SHA256SUMS` works from the download
        # dir. SHA256SUMS itself is deliberately NOT listed inside itself.
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum \
            "${{ needs.jar.outputs.jar_name }}" \
            "${{ needs.jar.outputs.dist_name }}" \
            "${{ needs.jar.outputs.sbom_name }}" \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Both files in a multi-line list. softprops/action-gh-release@v3
          # de-dupes by filename so we can list them explicitly.
          files: |
            release-assets/${{ needs.jar.outputs.jar_name }}
            release-assets/${{ needs.jar.outputs.dist_name }}
            release-assets/${{ needs.jar.outputs.sbom_name }}
            release-assets/SHA256SUMS
          name: Saiku ${{ needs.jar.outputs.version }}
          body: |
            ## Saiku ${{ needs.jar.outputs.version }}

            Two downloads attached:

            - `${{ needs.jar.outputs.dist_name }}` — **recommended.** Runnable bundle:
              JAR + README + `run.sh`/`run.bat`. Unzip and `./run.sh`.
            - `${{ needs.jar.outputs.jar_name }}` — bare fat JAR for users who want to
              wire the launcher into their own startup script. `java -jar saiku-*.jar serve`.

            Docker image (multi-arch): `ghcr.io/${{ github.repository }}:${{ needs.jar.outputs.version }}`

            #### Supply-chain

            - `${{ needs.jar.outputs.sbom_name }}` — CycloneDX SBOM covering the shaded launcher's dependency set.
            - `SHA256SUMS` — checksums for every asset above.
            - Each asset (JAR, dist zip, SBOM) and the container image carry a **Sigstore-signed SLSA build provenance** attestation (Rekor-logged). Verify with `gh attestation verify` / `cosign`. See [docs/releasing.md](https://github.com/${{ github.repository }}/blob/main/docs/releasing.md#verifying-release-artifacts).

            ### Auto-generated changelog
          # generate_release_notes appends GitHub's auto-generated "What's
          # Changed" + "Full Changelog" sections after the `body:` text.
          generate_release_notes: true
          draft: false
          prerelease: false

  npm-embed:
    # Publishes the <saiku-embed/> Web Component bundle to npm as
    # @concepttocloud/saiku-embed on every tag push. The bundle is also
    # served at /ui/saiku-embed.js from the launcher — the npm release
    # is the convenience path for React / Vue / SPA users who want to
    # `npm install` it. Best-effort: a failed publish (already-released
    # version on a re-run) skips silently rather than failing the
    # release.
    #
    # The embed npm line is version-tracked INDEPENDENTLY of the Maven
    # release tag (saiku-ui is a separate SvelteKit app — 3.x — while the
    # reactor is on 4.x). So this job publishes whatever version saiku-ui
    # carries, NOT the git tag; it only asserts the two embed packages are
    # internally consistent. When saiku-ui's version is unchanged since the
    # last release the publish 409s and is skipped — new only when the
    # embed line actually bumped.
    name: Publish @concepttocloud/saiku-embed to npm
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [jar]
    permissions:
      contents: read # checkout only; publish auth is NPM_TOKEN, not GITHUB_TOKEN
      id-token: write # npm --provenance mints an OIDC token for Sigstore (saiku#1992)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: saiku-ui/package-lock.json
      - name: Install + build embed bundle
        working-directory: saiku-ui
        # `npm run build` orchestrates build:app + build:embed +
        # build:embed-npm; we only need the last two so the embed
        # bundle is staged. Run the orchestrator anyway — it's
        # idempotent and keeps the script surface uniform with the
        # webapp's Maven-driven build.
        env:
          SAIKU_BASE_PATH: /ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify staged embed versions are internally consistent
        # The embed packages carry the saiku-ui version (staged by `npm run
        # build` from saiku-ui/package.json — the single source of truth).
        # We do NOT compare against the git tag: the embed npm line moves on
        # its own 3.x cadence while releases tag v4.x. What MUST hold is that
        # the two packages agree, and the React SDK pins the base bundle at
        # the same version so a consumer can't mix majors.
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./saiku-ui/embed-npm/package.json').version")
          REACT=$(node -p "require('./saiku-ui/embed-react-npm/package.json').version")
          REACT_DEP=$(node -p "require('./saiku-ui/embed-react-npm/package.json').dependencies['@concepttocloud/saiku-embed']")
          if [ "$REACT" != "$BASE" ]; then
            echo "::error::embed-react-npm version ($REACT) != embed-npm version ($BASE)"
            exit 1
          fi
          if [ "$REACT_DEP" != "$BASE" ]; then
            echo "::error::embed-react-npm depends on saiku-embed@$REACT_DEP but the bundle is $BASE"
            exit 1
          fi
          echo "publishing embed npm line at $BASE (embed-npm=$BASE embed-react-npm=$REACT dep=$REACT_DEP)"
      - name: npm publish base bundle
        # NPM_TOKEN is an Automation token on the @saikuanalytics scope;
        # set as a repo secret. The `|| echo` swallow keeps a re-publish
        # of an existing version from failing the whole release — npm
        # 409s and we just move on.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd saiku-ui/embed-npm
          npm publish --access public --provenance || \
            echo "::warning::npm publish (base) skipped (likely already-published or missing NPM_TOKEN)"
      - name: npm publish React SDK
        # Publishes @concepttocloud/saiku-embed-react (saiku#1432) with a
        # runtime dep pinned to the base bundle at the same version, so
        # a consumer can never accidentally mix majors across the two.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd saiku-ui/embed-react-npm
          npm publish --access public --provenance || \
            echo "::warning::npm publish (react) skipped (likely already-published or missing NPM_TOKEN)"

  docs-changelog:
    name: Open docs-site changelog PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [jar, release]
    permissions:
      contents: read # GITHUB_TOKEN only reads this repo's release notes; the cross-repo PR uses DOCS_SITE_PAT
    steps:
      # The PR needs to land in spiculedata/saiku-cloud — which means we
      # need a token with `repo` scope on THAT repo. The default
      # GITHUB_TOKEN is scoped to this repo only. Provide a PAT in the
      # repo's secrets as DOCS_SITE_PAT. The step is a no-op (with a
      # loud notice) if the secret is absent so a release doesn't fail
      # purely because the token rotation lapsed.
      - name: Guard on missing PAT
        id: guard
        env:
          DOCS_SITE_PAT: ${{ secrets.DOCS_SITE_PAT }}
        run: |
          if [ -z "$DOCS_SITE_PAT" ]; then
            echo "::warning::DOCS_SITE_PAT not set — skipping docs PR creation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout saiku-cloud
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spiculedata/saiku-cloud
          token: ${{ secrets.DOCS_SITE_PAT }}
          ref: develop
          path: saiku-cloud

      - name: Prepend draft changelog entry
        if: steps.guard.outputs.skip != 'true'
        env:
          REF_TAG: ${{ needs.jar.outputs.ref_tag }}
          VERSION: ${{ needs.jar.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd saiku-cloud
          CHANGELOG=docs-site/src/content/docs/help/changelog.mdx
          DATE=$(date -u +'%-d %B %Y')

          # Pull the GitHub-generated "What's Changed" markdown for this
          # tag. softprops/action already wrote it to the release body; we
          # refetch via the API so this job stays decoupled from the
          # upstream job. Releases are tagged WITH the leading v (the push
          # trigger is tags: ["v*"]), so query by $REF_TAG — querying by
          # the v-stripped $VERSION 404s and silently yields empty notes.
          NOTES=$(curl -sSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${REF_TAG}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('body','') or '')")

          # Build the new section in a temp file rather than a shell
          # variable. $(cat <<EOF) strips every trailing newline from the
          # captured string, which is what previously welded the section's
          # closing --- onto the next line of the file.
          #
          # The placeholder bullet asks a human editor to summarise the
          # notes in customer-facing language before merging; the raw merge
          # log goes into a collapsible <details> below.
          SECTION_FILE="$(mktemp)"
          {
            printf '## **%s** &nbsp;·&nbsp; *%s*\n\n' "$VERSION" "$DATE"
            printf '> **Draft** — replace these bullets with a customer-facing\n'
            printf '> summary of what changed, then merge. The auto-generated\n'
            printf '> merge log lives in the details block below for reference.\n\n'
            printf -- '- _Summarise the highlights here._\n\n'
            printf '<details>\n<summary>Auto-generated merge log</summary>\n\n'
            printf '%s\n\n' "$NOTES"
            printf '</details>\n\n'
            printf -- '---\n\n'
          } > "$SECTION_FILE"

          # Insert directly ABOVE the first existing entry — the first
          # level-2 "## " heading. This is frontmatter-agnostic: it always
          # lands below the intro (and its rule), newest-first, and never
          # between the frontmatter fence and the import/intro, which a
          # "\n---\n\n" search does because that marker matches the
          # frontmatter CLOSE. Both files are read by python from
          # env-provided paths — no shell-into-source interpolation, so
          # quotes and backslashes in the release notes can't break it.
          CHANGELOG="$CHANGELOG" SECTION_FILE="$SECTION_FILE" python3 - <<'PY'
          import os
          import re

          changelog_path = os.environ["CHANGELOG"]
          section_path = os.environ["SECTION_FILE"]

          with open(section_path, "r", encoding="utf-8") as f:
              new_section = f.read()

          with open(changelog_path, "r", encoding="utf-8") as f:
              body = f.read()

          match = re.search(r"^## ", body, re.MULTILINE)
          if match is None:
              # No entries yet — append after the existing content.
              updated = body.rstrip("\n") + "\n\n" + new_section
          else:
              cut = match.start()
              updated = body[:cut] + new_section + body[cut:]

          with open(changelog_path, "w", encoding="utf-8") as f:
              f.write(updated)
          PY

          # Fail loudly rather than opening another unmergeable PR: the
          # import must survive at the head of its own line, and the new
          # heading must exist exactly once.
          grep -qx "import { Aside } from '@astrojs/starlight/components';" "$CHANGELOG" \
            || { echo "::error::changelog import line was mangled by the insert"; exit 1; }
          [ "$(grep -c "^## \*\*${VERSION}\*\*" "$CHANGELOG")" = "1" ] \
            || { echo "::error::expected exactly one '## **${VERSION}**' heading"; exit 1; }

      - name: Open the PR
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_PAT }}
          REF_TAG: ${{ needs.jar.outputs.ref_tag }}
          VERSION: ${{ needs.jar.outputs.version }}
        run: |
          set -euo pipefail
          cd saiku-cloud
          BRANCH="docs/changelog-${VERSION}"
          git config user.name "saiku-release-bot"
          git config user.email "release-bot@saiku.bi"
          git checkout -b "$BRANCH"
          git add docs-site/src/content/docs/help/changelog.mdx
          git commit -m "docs(changelog): draft entry for ${VERSION}"
          git push -u origin "$BRANCH"
          # Create the PR first; labels added separately so a missing
          # label on saiku-cloud never aborts the release (v4.5.1's
          # rebuild failed here because the `docs` label hadn't been
          # created upstream — the PR was actually pushed fine).
          PR_URL=$(gh pr create \
            --repo spiculedata/saiku-cloud \
            --base develop \
            --head "$BRANCH" \
            --title "docs(changelog): draft entry for ${VERSION}" \
            --body "Auto-opened by the saiku release workflow. The new section at the top of \`help/changelog.mdx\` is a draft — replace the placeholder bullet with a customer-facing summary of what changed, then merge.

          See [saiku release ${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${REF_TAG}) for the full notes.")
          echo "Opened: $PR_URL"
          # Best-effort labelling — surface a warning but don't fail.
          gh pr edit "$PR_URL" --repo spiculedata/saiku-cloud --add-label docs --add-label release \
            || echo "::warning::Failed to add docs/release labels to $PR_URL (probably missing on saiku-cloud — create them with: gh label create docs -R spiculedata/saiku-cloud)"
