# SAIKU PROPERTIES


saiku.olap.nonempty = true
saiku.web.export.csv.name = saiku-export
saiku.web.export.excel.name = saiku-export
saiku.web.export.excel.format = xlsx
saiku.web.export.excel.numberformat=#,##0.00

# saiku.web.export.csv.delimiter=,
# saiku.web.export.csv.textEscape=\"
# saiku.web.export.csv.textEncoding=UTF-8
# saiku.web.export.csv.useFormattedValue=false
# saiku.web.export.csv.dateformat=dd-MMM-yyyy
# saiku.web.export.csv.timestampformat=dd-MMM-yyyy HH:mm:ss
	
saiku.format.numberformat=#,##0.00

saiku.olap.convert.query=false

# Phase 5 — disk-backed Arrow query cache
# Bytes are stored under ${saiku.home}/cache/. Entries are keyed by a
# SHA-256 of the canonicalised ThinQuery plus a cube-metadata fingerprint.
saiku.cache.enabled=true
saiku.cache.ttl.minutes=30
saiku.cache.max.size.bytes=268435456

# saiku#1914 — query guardrails (CWE-400 / CWE-770).
# Every value below is a bound the SERVER enforces regardless of what the
# client asks for. See org.saiku.olap.util.QueryGuardrails.
# 300s statement timeout on every olap4j statement. Set 0 to disable
# (mondrian.rolap.queryTimeout in mondrian.properties is the coarser backstop).
saiku.olap.query.timeout.seconds=300
# Server-side ceiling on drillthrough / export rows. maxrows=0 (or a request
# above this) is clamped down to it, so there is no "return everything" mode.
saiku.olap.max.rows=100000
# Byte budget for the Arrow allocators backing the cellset / drillthrough
# IPC writers (was new RootAllocator() == Long.MAX_VALUE).
saiku.olap.arrow.max.bytes=268435456

# SET FIXED LOCALE, otherwise JVM locale
#saiku.format.default.locale=de_AT
#saiku.format.default.locale=en
#saiku.format.default.locale=lt


