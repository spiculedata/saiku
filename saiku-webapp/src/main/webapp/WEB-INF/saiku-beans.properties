# Schema-generation LLM provider. 'noop' (default, offline rule-based) or 'anthropic'.
saiku.schemagen.llm.provider=noop
# Anthropic credentials (only used when provider=anthropic). If left blank, the
# factory falls back to the ANTHROPIC_API_KEY environment variable; if that is
# also unset, the provider degrades to noop with a WARN log at startup.
saiku.schemagen.llm.anthropic.apiKey=
# Optional model id override (defaults to AnthropicProvider.DEFAULT_MODEL).
saiku.schemagen.llm.anthropic.model=